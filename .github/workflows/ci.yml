name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Rust and Book checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - name: Install pinned Book tools
        run: |
          cargo anchor --version
          cargo install mdbook --version 0.5.4 --locked --root target/tools
          echo "$GITHUB_WORKSPACE/target/tools/bin" >> "$GITHUB_PATH"
      - name: Check tool identities
        run: |
          rustc --version
          cargo anchor --version
          test "$(mdbook --version)" = "mdbook v0.5.4"
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Compilation
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust API documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --locked
      - name: Upload Rust API documentation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rustdoc
          path: target/doc/
          if-no-files-found: error
          retention-days: 14
      - name: Process fixture prerequisites
        run: python3 --version && command -v ps
      - name: Tests
        run: cargo test --workspace --locked
      - name: Capability probe regression
        run: python3 -m unittest discover -s experiments/acp-integration -p 'test_probe_agent.py'
      - name: Bootstrap consistency
        run: cargo test -p anchor-runner --test bootstrap_consistency --locked
      - name: Book structure
        run: cargo anchor check --config anchorbook.toml
      - name: Render Book
        run: mdbook build
      - name: Whitespace
        run: git show --format= --check HEAD
