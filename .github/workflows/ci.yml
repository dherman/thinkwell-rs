name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Rust and Book checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - name: Install pinned Book tools
        run: |
          cargo anchor --version
          cargo install mdbook --version 0.5.4 --locked --root target/tools
          cargo install mdbook-mermaid --version 0.17.1 --locked --root target/tools
          cargo install cargo-nextest --version 0.9.151 --locked --root target/tools
          echo "$GITHUB_WORKSPACE/target/tools/bin" >> "$GITHUB_PATH"
      - name: Check tool identities
        run: |
          rustc --version
          cargo anchor --version
          test "$(mdbook --version)" = "mdbook v0.5.4"
          test "$(mdbook-mermaid --version)" = "mdbook-mermaid 0.17.1"
          nextest_identity="$(cargo nextest --version)"
          case "$nextest_identity" in
            "cargo-nextest 0.9.151 "*) ;;
            *) echo "Unexpected nextest identity: $nextest_identity"; exit 1 ;;
          esac
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Compilation
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust API documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --locked
      - name: Upload Rust API documentation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rustdoc
          path: target/doc/
          if-no-files-found: error
          retention-days: 14
      - name: Process fixture prerequisites
        run: python3 --version && command -v ps
      - name: Tests
        run: cargo test --workspace --locked
      - name: Capability probe regression
        run: python3 -m unittest discover -s experiments/acp-integration -p 'test_probe_agent.py'
      - name: Bootstrap consistency
        run: cargo test -p anchor-runner --test bootstrap_consistency --locked
      - name: Book structure
        run: cargo anchor check --config anchorbook.toml
      - name: Anchor verification
        # Verification reports criterion states; exit 0 is not universal satisfaction.
        # Keep the engine report in the job log, separate from rendered Book output.
        run: cargo anchor verify --config anchorbook.toml --method test
      - name: Prepare Book diagrams
        run: mdbook-mermaid install .
      - name: Render Book
        run: mdbook build
      - name: Whitespace
        run: git show --format= --check HEAD

  meeting-scheduler:
    name: Meeting scheduler example
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/meeting-scheduler
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - name: Install CMake for vendored Z3
        run: |
          python3 -m venv "$RUNNER_TEMP/scheduler-tools"
          "$RUNNER_TEMP/scheduler-tools/bin/pip" install cmake==3.31.10
          echo "$RUNNER_TEMP/scheduler-tools/bin" >> "$GITHUB_PATH"
          c++ --version
          python3 --version
      - name: Native build tool identity
        id: native-tools
        run: |
          cmake --version
          fingerprint=$({ cc --version; c++ --version; cmake --version; ld --version; ldd --version; } | sha256sum | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Cache scheduler dependencies and native Z3
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Target paths are relative to the selected Cargo workspace.
          workspaces: examples/meeting-scheduler -> ../../target/meeting-scheduler
          key: native-v1-ubuntu-24.04-${{ steps.native-tools.outputs.fingerprint }}
          cache-bin: "false"
      - name: Formatting
        run: cargo fmt --manifest-path examples/meeting-scheduler/Cargo.toml -- --check
      - name: Compilation
        run: cargo check --manifest-path examples/meeting-scheduler/Cargo.toml --all-targets --locked
      - name: Clippy
        run: cargo clippy --manifest-path examples/meeting-scheduler/Cargo.toml --all-targets --locked -- -D warnings
      - name: Deterministic tests (no agent credentials)
        run: cargo test --manifest-path examples/meeting-scheduler/Cargo.toml --locked

  sentiment-analysis:
    name: Sentiment analysis example
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/sentiment-analysis
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - name: Process fixture prerequisites
        run: python3 --version
      - name: Formatting
        run: cargo fmt --manifest-path examples/sentiment-analysis/Cargo.toml -- --check
      - name: Compilation
        run: cargo check --manifest-path examples/sentiment-analysis/Cargo.toml --all-targets --locked
      - name: Clippy
        run: cargo clippy --manifest-path examples/sentiment-analysis/Cargo.toml --all-targets --locked -- -D warnings
      - name: Deterministic tests (no agent credentials)
        run: cargo test --manifest-path examples/sentiment-analysis/Cargo.toml --locked

  javascript-unminifier:
    name: JavaScript unminifier example
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/unminifier
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - name: Process fixture prerequisites
        run: python3 --version
      - name: Formatting
        run: cargo fmt --manifest-path examples/javascript-unminifier/Cargo.toml -- --check
      - name: Compilation
        run: cargo check --manifest-path examples/javascript-unminifier/Cargo.toml --all-targets --locked
      - name: Clippy
        run: cargo clippy --manifest-path examples/javascript-unminifier/Cargo.toml --all-targets --locked -- -D warnings
      - name: Deterministic tests (no agent credentials)
        run: cargo test --manifest-path examples/javascript-unminifier/Cargo.toml --locked

  documentation:
    name: Documentation site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/website-check
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.12.0'
      - name: Compile tutorials and check source excerpts (no inference)
        run: python3 website/scripts/check_examples.py
      - name: Validate Mintlify content and build
        working-directory: website
        run: npx --yes mint@4.3.84 validate --telemetry false
      - name: Check website links
        working-directory: website
        run: npx --yes mint@4.3.84 broken-links --telemetry false
