[package]
name = "thinkwell"
version = "0.0.0"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
agent-client-protocol = { version = "=5.4.0", features = ["process"] }
axum = "0.8"
schemars = "=1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
