[package]
name = "thinkwell-javascript-unminifier"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
oxc = { version = "=0.159.0", features = ["semantic"] }
thinkwell = { path = "../../crates/thinkwell" }
schemars = "=1.2.3"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "time", "net"] }

[dev-dependencies]
tempfile = "3"
