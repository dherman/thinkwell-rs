[package]
name = "thinkwell-meeting-scheduler"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Independent workspace: normal Thinkwell builds do not compile the native solver.
[workspace]

[dependencies]
thinkwell = { path = "../../crates/thinkwell" }
schemars = "=1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "net"] }
z3 = { version = "=0.23.0", features = ["vendored"] }

[dev-dependencies]
tempfile = "3"
