[package]
name = "thinkwell-acp-experiment"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
agent-client-protocol = { version = "=5.4.0", features = ["schemars", "unstable_mcp_over_acp", "process"] }
futures = "0.3"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net"] }
axum = "0.8"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
